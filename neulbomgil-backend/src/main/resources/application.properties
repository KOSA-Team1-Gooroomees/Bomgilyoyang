file.upload-dir=C:/uploads

# 파일 업로드 크기 설정
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

spring.application.name=neulbomgil-backend
server.port=8088
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/neulbomgil?characterEncoding=UTF-8&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=mysql
logging.level.org.hibernate=info
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
vworld.api.key=${API_KEY}
# SQL 로그
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#spring.jpa.properties.hibernate.use_sql_comments=true
# 메일 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_ID}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# 카카오 로그인 설정
# 카카오 디벨로퍼스에서 발급받은 REST API 키
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_KEY}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_KEY}
# 카카오 디벨로퍼스에 등록할 URI
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8088/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
# 동의 항목 설정에 따라 변경 가능
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
# 카카오 응답 데이터 중 식별자 필드명
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
# 카카오 지도 API 설정
kakao.map.api-key=${KAKAO_MAP_API_KEY}