<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>게시글 작성 - 봄길 요양</title>

    <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

<!-- NAVBAR -->
<nav>
    <div th:replace="~{fragments/header :: header}"></div>
</nav>
<div class="flex-1">
    <!-- LAYOUT -->
    <div class="relative max-w-6xl mx-auto px-4 py-6 grid grid-cols-[220px_1fr] gap-5 ">

        <!-- SIDEBAR -->
        <aside class="flex flex-col gap-4 bg-bg-soft">
            <!-- 배너 -->
            <div class="bg-[#a8c5b5] rounded-xl p-5 relative overflow-hidden min-h-[160px]">
                <p class="text-sm font-bold text-primary-dark mb-2">봄길요양 커뮤니티</p>
                <p class="text-xs text-gray-600 leading-relaxed">시설 이용 정보와<br/>다양한 소식을<br/>함께 나눠요.</p>
                <img src="/images/characters/rumi-search.png" alt="마스코트"
                     class="absolute bottom-0 right-2 w-20 "
                     onerror="this.style.display='none'"/>

            </div>
            <!-- 글쓰기 버튼 -->
            <button sec:authorize="isAnonymous()"
                    onclick="requireLogin()"
                    class="w-full py-3 bg-[#2F6F42] hover:bg-primary-dark text-white font-bold rounded-lg text-sm cursor-pointer border-0 transition-colors">
                ✏️ 글쓰기
            </button>
            <a sec:authorize="isAuthenticated()"
               th:href="@{/boards/new}"
               class="block w-full py-3 bg-[#2F6F42] hover:bg-primary-dark text-white font-bold rounded-lg text-sm text-center no-underline transition-colors">
                ✏️ 글쓰기
            </a>


            <!-- 채팅 -->
            <div class="border border-gray-200 rounded-xl p-4"  style="box-shadow:0 4px 6px rgba(0,0,0,0.22); background: rgba(255,255,255,0.35);">
                <p class="text-sm font-bold mb-1.5">도움이 필요하신가요?</p>
                <p class="text-xs text-gray-500 leading-relaxed mb-3">관리자와 1:1 채팅으로<br/>빠르게 문의해보세요.</p>
                <button type="button" id="chatOpenBtn" class="w-full py-2 bg-[#79a9ba] hover:bg-[#8fb3a0] text-white text-xs font-semibold rounded-md border-0 cursor-pointer transition-colors">
                    채팅하기
                </button>
                <div
                        id="chatUnreadDot"
                        class="absolute -right-1 -top-1 hidden h-3 w-3 rounded-full bg-red-500">
                </div>
            </div>
        </aside>

    <!-- 작성 메인 -->
    <main class="bg-white rounded-xl p-8 shadow-sm">
        <!-- 상단 -->
        <div class="flex justify-between items-start mb-7">
            <div>
                <h2 class="text-xl font-bold">게시글 작성</h2>
                <p class="text-xs text-gray-400 mt-1">게시판 > 새 게시글 작성</p>
            </div>
            <a th:href="@{/boards}"
               class="flex items-center gap-1.5 px-5 py-2 border border-gray-200 rounded-full text-sm text-gray-600 no-underline hover:border-primary-mid hover:text-primary transition-colors">
                &#8249; 목록으로 돌아가기
            </a>
        </div>

        <!-- 폼 -->
        <div class="flex flex-col gap-5">
            <!-- 제목 -->
            <div class="grid grid-cols-[80px_1fr] items-start">
                <label class="text-base font-bold pt-2.5" for="title">제목</label>
                <input type="text" id="title" maxlength="100"
                       placeholder="제목을 입력해주세요."
                       class="px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm w-full focus:outline-none focus:border-primary-mid transition-colors"/>
            </div>

            <!-- 내용 -->
            <div class="grid grid-cols-[80px_1fr] items-start">
                <label class="text-base font-bold pt-2.5" for="content">내용</label>
                <textarea id="content" rows="12"
                          placeholder="내용을 입력해주세요."
                          class="px-3.5 py-3 border border-gray-200 rounded-lg text-sm w-full resize-y leading-relaxed focus:outline-none focus:border-primary-mid transition-colors"></textarea>
            </div>
            <!-- 파일 업로드 -->
            <div class="grid grid-cols-[80px_1fr] items-start">
                <label class="text-base font-bold pt-2.5">첨부파일</label>
                <div>
                    <div id="dropZone"
                         class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center cursor-pointer bg-gray-50 hover:border-primary-mid hover:bg-primary-light transition-colors"
                         onclick="document.getElementById('fileInput').click()"
                         ondragover="handleDragOver(event)"
                         ondragleave="handleDragLeave(event)"
                         ondrop="handleDrop(event)">
                        <div class="text-3xl mb-2">📎</div>
                        <p class="text-sm text-gray-500">
                            <span class="text-primary font-semibold">클릭</span>하거나 파일을 드래그해서 업로드하세요
                        </p>
                        <p class="text-xs text-gray-400 mt-1">이미지(jpg, png, gif), PDF, Word, Excel 등 · 파일당 최대 10MB · 최대 5개</p>
                    </div>
                    <input type="file" id="fileInput" multiple
                           accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.hwp"
                           class="hidden"
                           onchange="handleFileSelect(event)"/>
                    <div id="filePreviewList" class="flex flex-col gap-2 mt-3"></div>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="flex justify-center gap-3 mt-2">
                <button type="button" onclick="location.href='/boards'"
                        class="px-10 py-2.5 border border-gray-200 bg-white text-gray-600 rounded-lg text-sm font-semibold cursor-pointer hover:border-gray-400 transition-colors">
                    취소
                </button>
                <button type="button" id="submitBtn" onclick="submitBoard()"
                        class="px-10 py-2.5 border border-gray-200 bg-white text-gray-600 rounded-lg text-sm font-semibold cursor-pointer hover:border-gray-400 transition-colors">
                    등록하기
                </button>
            </div>
        </div>
    </main>
</div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:inline="javascript">
    function submitBoard() {
        const title   = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        if (!title)   { alert('제목을 입력해주세요.'); return; }
        if (!content) { alert('내용을 입력해주세요.'); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '등록 중...';

        fetch('/api/boards/inserts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}` // JWT
            },
            body: JSON.stringify({ title, content })
        })
            .then(res => {
                if (res.ok) {
                    alert('게시글이 등록되었습니다.');
                    location.href = '/boards';
                } else {
                    alert('등록 중 오류가 발생했습니다.');
                    btn.disabled = false;
                    btn.textContent = '등록하기';
                }
            })
            .catch(() => {
                alert('서버 오류가 발생했습니다.');
                btn.disabled = false;
                btn.textContent = '등록하기';
            });
    }
</script>
</body>
</html>
